# lol-predictor — Fase 0 (esqueleto). Elo inicial em data/teams_lol.json
# (bandas por liga ancoradas no GPR regional oficial; ordem intra-liga é
# estimativa declarada). Parâmetros de abates são PLACEHOLDERS a calibrar
# na Fase 1 (Riot API / Oracle's Elixir).
game: "League of Legends"
default_format: "bo3"
default_kills_line: 24.5
k_factor_base: 32          # BO1; BO3=40, BO5=48 (model.K_FACTORS)
bankroll: 1000
stake_unit: 50

model:
  # total médio de abates POR MAPA (dois times somados) — placeholder da era;
  # a Fase 1 mede por liga/patch (LCK historicamente mais baixo que LPL)
  league_avg_total_kills: 28.0
  # desvio-padrão do total de abates por mapa — placeholder declarado
  kills_std: 8.0

teams_file: data/teams_lol.json
# ratings correntes persistidos por update_ratings (ausente → initial_elo)
ratings_file: data/ratings.json
# médias por time (kills_per_game) materializadas na Fase 1; ausente → média
team_stats_file: data/team_stats.json

database: data/lol.db

# Fase 1 — Oracle's Elixir (CSVs locais em data/raw/; códigos de liga do OE,
# verificados no dado em 2026-07-11). LTA N/S = Américas pós-2025; FST =
# First Stand; EWC = Esports World Cup; WLDs = Worlds.
oracle:
  leagues: ["LCK", "LPL", "LEC", "LCS", "LTA", "LTA N", "LTA S",
            "MSI", "WLDs", "FST", "EWC"]

# Fase 1 — backtest prequential
backtest:
  burnin_days: 90           # ratings convergem da semente antes de medir
  min_team_games: 10        # métrica só conta jogo onde ambos têm histórico
  default_seed_elo: 1400    # time fora do Top 30 semeado abaixo do último
  kills_lines: [24.5, 27.5, 30.5]
  min_league_games_kills: 30   # média/sigma por liga só valem com amostra
  bootstrap_iterations: 1000
  bootstrap_seed: 13
