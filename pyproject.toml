[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lol-predictor"
version = "2.1.0"
description = "Fail-closed League of Legends prediction domain"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx>=0.28,<1", "numpy>=2.3,<3", "pandas>=2.3,<3",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "pyyaml>=6,<7",
  "scipy>=1.16,<2", "predictor-core>=2.3,<3", "predictor-ops>=3.1,<4",
]

[project.optional-dependencies]
# Cliente de transmissão real de ordem (src/execution_polymarket.py). Extra
# separado de propósito: a instalação base nunca precisa da stack web3, e
# `go_gate()` continua NO-GO por construção com ou sem este extra instalado.
execution = ["py-clob-client>=0.34,<1"]

[project.scripts]
lol-predictor = "src.cli:main"
lol-scheduler = "src.cli:scheduler_main"

[project.entry-points."predictor.plugins"]
lol = "lol_predictor_plugin:Plugin"

[dependency-groups]
dev = ["build>=1.3", "pre-commit>=4.3", "pyright>=1.1.403", "pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.12"]

[tool.uv.sources]
predictor-core = { url = "https://github.com/leonardosovienski/core-predictor/releases/download/v2.3.0/predictor_core-2.3.0-py3-none-any.whl" }
predictor-ops = { url = "https://github.com/leonardosovienski/predictor-ops/releases/download/v3.1.0/predictor_ops-3.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src", "lol_predictor_plugin", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 70
show_missing = true
