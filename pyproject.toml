[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lol-predictor"
version = "2.0.0"
description = "Fail-closed League of Legends prediction domain"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx>=0.28,<1", "numpy>=2.3,<3", "pandas>=2.3,<3",
  "pydantic>=2.11,<3", "pydantic-settings>=2.10,<3", "pyyaml>=6,<7",
  "scipy>=1.16,<2", "predictor-core==2.1.0", "predictor-ops==2.0.0",
]

[project.scripts]
lol-predictor = "src.cli:main"
lol-scheduler = "src.cli:scheduler_main"

[project.entry-points."predictor.plugins"]
lol = "src.plugin:LolPredictorPlugin"

[dependency-groups]
dev = ["build>=1.3", "pre-commit>=4.3", "pyright>=1.1.403", "pytest>=8.4", "pytest-cov>=6.2", "ruff>=0.12"]

[tool.uv.sources]
predictor-core = { path = "wheelhouse/predictor_core-2.1.0-py3-none-any.whl" }
predictor-ops = { path = "wheelhouse/predictor_ops-2.0.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src/settings.py", "src/errors.py", "src/repositories.py", "src/services.py", "src/plugin.py", "src/cli.py"]
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 0
show_missing = true
