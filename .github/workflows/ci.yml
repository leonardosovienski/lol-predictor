name: CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.13", "3.14"]}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: uv sync --all-groups --python ${{ matrix.python }}
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run pyright
      - run: uv run pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70
      - name: Homologated runtime branch coverage
        run: >-
          uv run pytest
          --cov=src.model --cov=src.predict --cov=src.config --cov=src.data.ingestion
          --cov=src.h4_gate --cov=src.settings --cov=src.plugin --cov=src.services
          --cov-branch --cov-report=term-missing --cov-fail-under=80
      - run: uv build
      - run: uv run lol-predictor validate-env .env.example
      - run: uv run lol-scheduler validate jobs.json
      - name: wheel smoke outside checkout
        run: |
          uv venv /tmp/lol-wheel --python ${{ matrix.python }} --seed
          /tmp/lol-wheel/bin/pip install dist/*.whl \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v2.3.0/predictor_core-2.3.0-py3-none-any.whl" \
            "predictor-ops @ https://github.com/leonardosovienski/predictor-ops/releases/download/v3.1.0/predictor_ops-3.1.0-py3-none-any.whl"
          cd /tmp
          /tmp/lol-wheel/bin/lol-predictor validate-env "$OLDPWD/.env.example"
          /tmp/lol-wheel/bin/lol-scheduler validate "$OLDPWD/jobs.json"
          /tmp/lol-wheel/bin/python -c "import scripts.backtest_walkforward, scripts.settle_h4_signals"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lol-predictor:test .
      - run: docker run --rm --read-only --tmpfs /tmp lol-predictor:test health
      - uses: anchore/sbom-action@v0
        with:
          image: lol-predictor:test
          artifact-name: lol-predictor.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lol-predictor:test
          severity: CRITICAL,HIGH
          exit-code: "1"
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with: {path: ".", output-file: "sbom.spdx.json"}
